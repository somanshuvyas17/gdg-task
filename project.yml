name: DigitalArchive
options:
  bundleIdPrefix: com.digitalarchive
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  DigitalArchive:
    type: application
    platform: iOS
    sources:
      - path: DigitalArchive
    settings:
      base:
        PRODUCT_NAME: DigitalArchive
        PRODUCT_BUNDLE_IDENTIFIER: com.digitalarchive.app
        INFOPLIST_FILE: DigitalArchive/Resources/Info.plist
        SWIFT_VERSION: "5.10"
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    dependencies: []

  DigitalArchiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DigitalArchiveTests
    dependencies:
      - target: DigitalArchive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.digitalarchive.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  DigitalArchive:
    build:
      targets:
        DigitalArchive: all
        DigitalArchiveTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: DigitalArchiveTests
